<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2B2116" />
    <meta name="description" content="Espaço dos fundadores: ideias, pendências e o que já está consolidado no novo sistema de RPG." />
    <title>Novo RPG</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="#inicio" id="brand">Novo RPG</a>
        <nav class="tabs" id="tabs" aria-label="Seções">
          <a class="tab" href="#inicio" data-view="inicio">Início</a>
          <a class="tab" href="#ideias" data-view="ideias">Ideias <span class="tab__count" data-count="ideias"></span></a>
          <a class="tab" href="#pendencias" data-view="pendencias">Pendências <span class="tab__count" data-count="pendencias"></span></a>
          <a class="tab" href="#consolidado" data-view="consolidado">Consolidado <span class="tab__count" data-count="consolidado"></span></a>
        </nav>
      </div>
    </header>

    <main class="sheet" id="app" aria-live="polite">
      <div class="panel empty">Carregando os pergaminhos…</div>
    </main>

    <footer class="site-footer">
      <span>Feito pelos fundadores</span>
      <button type="button" class="linklike" id="export" hidden>Baixar backup (.json)</button>
    </footer>

    <dialog id="dlg" class="dlg" aria-labelledby="dlg-title"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <noscript><p class="panel">Este site precisa de JavaScript para funcionar.</p></noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>

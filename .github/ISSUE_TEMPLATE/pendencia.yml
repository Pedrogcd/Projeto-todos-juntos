name: Pendência
description: Registre algo que precisa ser feito para o projeto avançar
title: "[Pendência] "
labels: ["pendente"]
body:
  - type: markdown
    attributes:
      value: |
        Depois de enviada, a pendência aparece na coluna **A fazer** da aba **Pendências**.
        Para movê-la para **Em andamento**, troque a etiqueta `pendente` por `em-andamento`.
  - type: textarea
    id: oque
    attributes:
      label: O que precisa ser feito
    validations:
      required: true
  - type: dropdown
    id: categoria
    attributes:
      label: Categoria
      options:
        - Mecânicas
        - Mundo e lore
        - Narrativa
        - Arte e visual
        - Outro
    validations:
      required: true
  - type: input
    id: responsavel
    attributes:
      label: Quem pode pegar isso?
      description: Nome ou usuário do GitHub (opcional).
    validations:
      required: false
